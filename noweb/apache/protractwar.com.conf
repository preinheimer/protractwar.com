# protractwar.com — static site
# Deploy to /var/www/protractwar.com (docroot/ is served).
# Requires Apache 2.4.34+ (for <IfFile>) and: mod_rewrite mod_headers mod_expires mod_deflate mod_ssl
#
# Bootstrapping HTTPS:
#   Until the Let's Encrypt cert exists, the site is served over plain HTTP and the
#   HTTPS vhosts below are skipped, so Apache starts fine. Once you have the cert:
#     certbot certonly --webroot -w /var/www/protractwar.com/docroot \
#       -d protractwar.com -d www.protractwar.com \
#       --deploy-hook "systemctl reload apache2"
#   then `systemctl reload apache2`. HTTPS turns on and HTTP starts redirecting.
#   (<IfFile> is only evaluated at startup/reload, hence the deploy hook.)

Define PROTRACTWAR_CERT /etc/letsencrypt/live/protractwar.com/fullchain.pem
Define PROTRACTWAR_KEY  /etc/letsencrypt/live/protractwar.com/privkey.pem

# Site settings shared by the HTTP and HTTPS vhosts
<Directory /var/www/protractwar.com/docroot>
  Require all granted
  Options -Indexes
  AllowOverride None
  DirectoryIndex index.html

  # The PDFs are downloads; tell browsers to save rather than render inline
  <FilesMatch "\.pdf$">
    Header set Content-Disposition attachment
  </FilesMatch>

  Header always set X-Frame-Options SAMEORIGIN
  Header always set X-Content-Type-Options nosniff
  Header always set Referrer-Policy "no-referrer, strict-origin-when-cross-origin"
  Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), microphone=(), usb=()"

  AddDefaultCharset utf-8

  ExpiresActive On
  ExpiresByType text/html "access plus 0 seconds"
  ExpiresByType application/pdf "access plus 1 day"
  ExpiresByType image/png "access plus 1 month"
  ExpiresByType image/svg+xml "access plus 1 month"
  ExpiresByType image/x-icon "access plus 1 month"

  <IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/css text/plain image/svg+xml application/javascript
  </IfModule>
</Directory>

# Plain HTTP. Serves the site until the cert exists; afterwards redirects to
# https://protractwar.com, except ACME challenges so renewals keep working.
<VirtualHost *:80>
  ServerAdmin webmaster@protractwar.com
  ServerName protractwar.com
  ServerAlias www.protractwar.com

  DocumentRoot /var/www/protractwar.com/docroot

  <IfFile ${PROTRACTWAR_CERT}>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://protractwar.com%{REQUEST_URI} [R=301,L]
  </IfFile>

  CustomLog /var/log/apache2/protractwar.com_access.log combined
  LogLevel warn
  ErrorLog /var/log/apache2/protractwar.com_error.log
</VirtualHost>

<IfModule ssl_module>
<IfFile ${PROTRACTWAR_CERT}>

# HTTPS www: redirect to apex
<VirtualHost *:443>
  ServerAdmin webmaster@protractwar.com
  ServerName www.protractwar.com

  Redirect permanent / https://protractwar.com/

  SSLEngine On
  SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
  SSLCertificateFile ${PROTRACTWAR_CERT}
  SSLCertificateKeyFile ${PROTRACTWAR_KEY}

  CustomLog /var/log/apache2/protractwar.com_access.log combined
  LogLevel warn
  ErrorLog /var/log/apache2/protractwar.com_error.log
</VirtualHost>

# HTTPS apex: the site
<VirtualHost *:443>
  ServerAdmin webmaster@protractwar.com
  ServerName protractwar.com

  DocumentRoot /var/www/protractwar.com/docroot

  Header always set Strict-Transport-Security "max-age=31536000"

  SSLEngine On
  SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
  SSLCertificateFile ${PROTRACTWAR_CERT}
  SSLCertificateKeyFile ${PROTRACTWAR_KEY}

  CustomLog /var/log/apache2/protractwar.com_access.log combined
  LogLevel warn
  ErrorLog /var/log/apache2/protractwar.com_error.log
</VirtualHost>

</IfFile>
</IfModule>
